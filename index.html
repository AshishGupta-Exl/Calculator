<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="A fast, keyboard-friendly calculator." />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129518;</text></svg>"
    />
  </head>
  <body>
    <main class="calculator">
      <header class="calculator__header">
        <h1 class="calculator__title">Calculator</h1>
        <button
          type="button"
          class="theme-toggle"
          id="theme-toggle"
          aria-pressed="false"
          title="Switch between dark and light appearance"
        >
          <span class="theme-toggle__icon" aria-hidden="true"></span>
          <span class="visually-hidden">Toggle colour theme</span>
        </button>
      </header>

      <div class="display">
        <div class="display__expression" id="expression" aria-hidden="true"></div>
        <output class="display__value" id="display" aria-live="polite" aria-atomic="true">0</output>
      </div>

      <div class="keypad" id="keypad">
        <button type="button" class="key key--function" data-action="clear">AC</button>
        <button type="button" class="key key--function" data-action="backspace" aria-label="Backspace">
          <span aria-hidden="true">&#9003;</span>
        </button>
        <button type="button" class="key key--function" data-action="percent" aria-label="Percent">%</button>
        <button type="button" class="key key--operator" data-operator="/" aria-label="Divide">&#247;</button>

        <button type="button" class="key" data-digit="7">7</button>
        <button type="button" class="key" data-digit="8">8</button>
        <button type="button" class="key" data-digit="9">9</button>
        <button type="button" class="key key--operator" data-operator="*" aria-label="Multiply">&#215;</button>

        <button type="button" class="key" data-digit="4">4</button>
        <button type="button" class="key" data-digit="5">5</button>
        <button type="button" class="key" data-digit="6">6</button>
        <button type="button" class="key key--operator" data-operator="-" aria-label="Subtract">&#8722;</button>

        <button type="button" class="key" data-digit="1">1</button>
        <button type="button" class="key" data-digit="2">2</button>
        <button type="button" class="key" data-digit="3">3</button>
        <button type="button" class="key key--operator" data-operator="+" aria-label="Add">+</button>

        <button type="button" class="key" data-action="toggle-sign" aria-label="Toggle sign">&#177;</button>
        <button type="button" class="key" data-digit="0">0</button>
        <button type="button" class="key" data-action="decimal" aria-label="Decimal point">.</button>
        <button type="button" class="key key--equals" data-action="equals" aria-label="Equals">=</button>
      </div>

      <p class="hint">
        Tip: use your keyboard &mdash; digits, <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd>,
        <kbd>Enter</kbd> to equal, <kbd>Backspace</kbd> to delete, <kbd>Esc</kbd> to clear.
      </p>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
